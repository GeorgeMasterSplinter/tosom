# ToSom — CD Pipeline (Vercel Deployment)
# Kjøres etter at CI er fullført med grønn status på main/master

name: ToSom CD

# A3 — Kvalitetsporten. CD gikk tidligere rett på push til main, uavhengig av
# CI. En rød CI (typefeil, rød test, brutt invariant-vakt) stanset altså ingen
# deploy. Nå kjører CD kun etter at «ToSom CI» er FULLFØRT med konklusjon
# 'success' på main — porten er reell, ikke dekorativ.
on:
  workflow_run:
    workflows: ["ToSom CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── PRE-DEPLOY CI GATE (funn 8, systemaudit 03.09) ───
  # Manuell trigger (workflow_dispatch) omgikk tidligere kvalitetsporten:
  # «if: workflow_dispatch || ci_green» short-circuiterer til true, så en
  # manuell deploy kunne kjøre selv med rød/ikke-kjørt CI. Nå må en MANUELL
  # deploy kjøre de sentrale quality-checkene (lint + tsc + lang + jest), og
  # de må gå grønn — deploy er avhengig av denne via «needs: ci-gate». For
  # automatisk trigger (workflow_run) er CI allerede grønn (conclusion-filtret),
  # så gate-jobben er en no-op (undgår dobbelt CI).
  ci-gate:
    name: Pre-Deploy CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Auto-trigger — CI kjørte allerede (deploy gates på conclusion)
        if: github.event_name == 'workflow_run'
        run: echo "Auto-trigger (workflow_run) — deploy er gattet på CI-conclusion, ingen gjenkjøring."
      - name: Checkout (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      - name: Setup Node.js (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Prisma generate (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx prisma generate
      - name: ESLint (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx next lint --max-warnings 0
      - name: Type check (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx tsc --noEmit
      - name: Language invariant (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify:lang
      - name: Unit tests (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx jest --ci --silent

  # ─── DB MIGRATIONS (prod) — sak 7, systemaudit 03.09 ───
  # Prisma-migrasjoner til prod-DB kjører FØR Vercel-deploy, slik at schemat er
  # klart når ny kode går live. Idempotent — prisma migrate deploy legger kun på
  # ventende migrasjoner. Gated på samme måte som deploy: automatisk (workflow_run)
  # kun ved grønn CI, manuell (workflow_dispatch) kun ved grønn ci-gate. Krever
  # secrets.DATABASE_URL (prod, lagt inn 03.09). deploy er nå needs: db-migrate.
  db-migrate:
    name: Apply DB Migrations (prod)
    runs-on: ubuntu-latest
    needs: ci-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply pending migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─── DEPLOY TO VERCEL ───
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [ci-gate, db-migrate]
    # Automatisk trigger (workflow_run) krever grønn CI (conclusion). Manuell
    # trigger (workflow_dispatch) krever at ci-gate kjørte grønn (needs).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://tosom.no
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm i -g vercel

      # .vercel/ er gitignored → prosjektlenken eksisterer ikke i CI.
      # vercel pull --yes feiler umiddelbart uten den (rotårsak i CD 23–171:
      # alle ekte deploy-kjøringer har feilet i dette steget).
      # Lenken bygges derfor ved kjøring fra org/project-ID i secrets.
      - name: Link Vercel Project
        run: |
          mkdir -p .vercel
          printf '{\n  "orgId": "%s",\n  "projectId": "%s",\n  "projectName": "tosom"\n}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel Environment Info
        run: vercel pull --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Output
        run: |
          echo "Deployment successful!"
          echo "URL: https://tosom.no"

  # ─── DOCKER BUILD & PUSH ───
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/tosom
            ghcr.io/${{ github.repository_owner }}/tosom
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── POST-DEPLOY HEALTH CHECK ───
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Health Check
        run: |
          echo "Waiting 60s for deployment to stabilize..."
          sleep 60
          echo "Checking health endpoint..."
          curl -f https://tosom.no/api/system/health || echo "Health check pending (may need stabilization time)"

  # ─── DEPLOY GATE (synlig kvalitetsgate) ───
  # Gjør deploy-statusen synlig i CD-kjøringen:
  #   failure  → gate feiler (rød): ekte deploy-feil.
  #   skipped  → warning (gul) + grønn kjøring: CI var ikke grønn, deploy hoppes
  #              bevisst over (IKKE en deploy-feil — CI-rødt er selve signalet).
  #   success  → grønn: deploy OK.
  deploy-gate:
    name: Deploy Gate
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Verify Deploy Ran
        run: |
          RESULT="${{ needs.deploy.result }}"
          if [ "$RESULT" = "failure" ]; then
            echo "::error::Deploy-jobben feilet."
            exit 1
          fi
          if [ "$RESULT" = "skipped" ]; then
            echo "::warning::Deploy-jobben ble hoppet over — CI var ikke grønn."
            exit 0
          fi
          echo "Deploy-jobben fullførte med success."
