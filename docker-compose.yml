version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: tosom_dev_db
    restart: always
    environment:
      POSTGRES_USER: tosom
      POSTGRES_PASSWORD: tosom
      POSTGRES_DB: tosom_dev
    ports:
      - "127.0.0.1:5432:5432"   # F-2 (MASTERSPLINTER): bind til loopback — ikke eksponert på nettverket
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
