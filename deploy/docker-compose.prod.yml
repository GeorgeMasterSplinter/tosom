version: '3.8'

services:
  app:
    image: registry.tosom.no/tosom:prod
    container_name: tosom-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - TOSOM_ENV=production
      - LOG_LEVEL=info
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://tosom.no
      - AI_API_KEY=${AI_API_KEY}
      - API_BASE_URL=https://api.tosom.no
      - FRONTEND_BASE_URL=https://tosom.no
    depends_on:
      - postgres
    networks:
      - tosom-internal

  postgres:
    image: postgres:16-alpine
    container_name: tosom-db
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /backups:/backups
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    networks:
      - tosom-internal

  reverse-proxy:
    image: nginx:alpine
    container_name: tosom-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - tosom-internal

volumes:
  postgres-data:

networks:
  tosom-internal:
    driver: bridge
