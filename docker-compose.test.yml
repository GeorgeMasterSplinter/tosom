version: '3.8'

# ToSom — Test Database
# Start: docker-compose -f docker-compose.test.yml up -d
# Stop:  docker-compose -f docker-compose.test.yml down

services:
  test-postgres:
    image: postgres:16-alpine
    container_name: tosom_test_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tosom
      POSTGRES_PASSWORD: tosom
      POSTGRES_DB: tosom_test
    ports:
      - "5433:5432"  # <-- Viktig: annet port enn dev-db (5432)
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tosom"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tosom-test

volumes:
  test_postgres_data:

networks:
  tosom-test:
    driver: bridge