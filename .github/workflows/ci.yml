# ToSom — CI Pipeline
# Kjøres ved alle pushes og PRs til main/master

name: ToSom CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://localhost:5432/tosom_test'

jobs:
  # ─── LINT ───
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx next lint --max-warnings 0

  # ─── TYPECHECK ───
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript
        run: npx tsc --noEmit

  # ─── BUILD ───
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npx next build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: 'ci-test-secret-key'
          NEXTAUTH_URL: 'http://localhost:3000'


  # ─── PRISMA CHECK ───
  prisma:
    name: Prisma Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Check Prisma Schema Format
        run: npx prisma format --check

  # ─── AI DELETION GUARD ───
  ai-guard:
    name: AI Deletion Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no AI routes, components or lib remain
        run: |
          echo "Checking for re-introduction of deleted AI code..."
          # Grep for AI patterns; ignore node_modules and .next
          FOUND=$(grep -rn "api/ai/\|'lib/ai\|components/ai" \
            app components lib hooks providers 2>/dev/null \
            | grep -v node_modules || true)
          if [ -n "$FOUND" ]; then
            echo "FAIL: AI code detected (should be deleted):"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS: No AI references found."

  # ─── LANGUAGE GUARD (bokmål-only) ───
  lang-guard:
    name: Language Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no nynorsk words remain
        run: |
          echo "Checking for nynorsk words (should be bokmal)..."
          # Common nynorsk patterns that should not appear in codebase
          FOUND=$(grep -rn 'ikkje\|berre\b\|kva\b\|kvarandre\|avslutta\|sjå\b\|nokon\|korleis\|påverka\|mykje' \
            app lib components hooks providers 2>/dev/null \
            | grep -v node_modules || true)
          if [ -n "$FOUND" ]; then
            echo "FAIL: Nynorsk words detected (use bokmal):"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS: No nynorsk references found."

  # ─── COMBINED STATUS ───
  status:
    name: CI Status
    needs: [lint, typecheck, build, prisma, ai-guard, lang-guard]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check if all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
              [ "${{ needs.typecheck.result }}" != "success" ] || \
              [ "${{ needs.build.result }}" != "success" ] || \
              [ "${{ needs.prisma.result }}" != "success" ] || \
              [ "${{ needs.ai-guard.result }}" != "success" ] || \
              [ "${{ needs.lang-guard.result }}" != "success" ]; then
            echo "CI pipeline failed!"
            exit 1
          fi
          echo "CI pipeline passed!"