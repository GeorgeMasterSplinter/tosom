# ToSom — CD Pipeline (Vercel Deployment)
# Kjøres etter at CI er fullført med grønn status på main/master

name: ToSom CD

# A3 — Kvalitetsporten. CD gikk tidligere rett på push til main, uavhengig av
# CI. En rød CI (typefeil, rød test, brutt invariant-vakt) stanset altså ingen
# deploy. Nå kjører CD kun etter at «ToSom CI» er FULLFØRT med konklusjon
# 'success' på main — porten er reell, ikke dekorativ.
on:
  workflow_run:
    workflows: ["ToSom CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── DEPLOY TO VERCEL ───
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Manuell kjøring (workflow_dispatch) slipper gjennom; automatisk kjøring
    # krever at CI-kjøringen som utløste denne faktisk var grønn.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://tosom.no
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Pull Vercel Environment Info
        run: vercel pull --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Output
        run: |
          echo "Deployment successful!"
          echo "URL: https://tosom.no"

  # ─── DOCKER BUILD & PUSH ───
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/tosom
            ghcr.io/${{ github.repository_owner }}/tosom
          tags: |
            type=ref,event=branch
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── POST-DEPLOY HEALTH CHECK ───
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Health Check
        run: |
          echo "Waiting 60s for deployment to stabilize..."
          sleep 60
          echo "Checking health endpoint..."
          curl -f https://tosom.no/api/system/health || echo "Health check pending (may need stabilization time)"