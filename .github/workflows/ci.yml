# ToSom — CI Pipeline
# Kjøres ved alle pushes og PRs til main/master

name: ToSom CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'
  DATABASE_URL: 'postgresql://tosom:tosom@localhost:5432/tosom_test'
  NEXTAUTH_SECRET: 'ci-test-secret-key'
  NEXTAUTH_URL: 'http://localhost:3000'
  ADMIN_JWT_SECRET: 'ci-admin-jwt-secret'
  CRON_SECRET: 'ci-cron-secret'

jobs:
  # ─── LINT ───
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx next lint --max-warnings 0

  # ─── TYPECHECK ───
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript
        run: npx tsc --noEmit

  # ─── BUILD ───
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js
        run: npx next build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}

  # ─── TESTS (unit) ───
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tosom
          POSTGRES_PASSWORD: tosom
          POSTGRES_DB: tosom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tosom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run Jest tests
        run: npm test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          ADMIN_JWT_SECRET: ${{ env.ADMIN_JWT_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}

  # ─── E2E TESTS (Playwright) ───
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tosom
          POSTGRES_PASSWORD: tosom
          POSTGRES_DB: tosom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tosom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app for E2E
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          ADMIN_JWT_SECRET: ${{ env.ADMIN_JWT_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}

      - name: Run Playwright tests
        run: npx playwright test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ env.NEXTAUTH_URL }}
          NEXT_PUBLIC_APP_URL: 'http://localhost:3000'
          ADMIN_JWT_SECRET: ${{ env.ADMIN_JWT_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ─── PRISMA CHECK ───
  prisma:
    name: Prisma Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Check Prisma Schema Format
        run: npx prisma format --check

  # ─── PRISMA SINGLETON GUARD (B0.8) ───
  prisma-singleton:
    name: Ingen egen PrismaClient
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Kun singleton PrismaClient fra lib/prisma.ts
        run: |
          echo "Checking for ad-hoc PrismaClient instances (should use lib/prisma.ts singleton)..."
          if grep -rn "new PrismaClient" app/ lib/ --include=*.ts | grep -v "lib/prisma.ts"; then
            echo "::error::Bruk singleton fra lib/prisma.ts"
            exit 1
          fi
          echo "PASS: No ad-hoc PrismaClient found."

  # ─── AI DELETION GUARD ───
  ai-guard:
    name: AI Deletion Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no AI routes, components or lib remain
        run: |
          echo "Checking for re-introduction of deleted AI code..."
          FOUND=$(grep -rn "api/ai/\|'lib/ai\|components/ai" \
            app components lib hooks providers 2>/dev/null \
            | grep -v node_modules || true)
          if [ -n "$FOUND" ]; then
            echo "FAIL: AI code detected (should be deleted):"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS: No AI references found."

  # ─── LANGUAGE GUARD (bokmål-only) ───
  lang-guard:
    name: Language Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no nynorsk words remain
        run: |
          echo "Checking for nynorsk words (should be bokmal)..."
          FOUND=$(grep -rnE '\bikkje\b|\bberre\b|\bkva\b|\bkvarandre\b|\bavslutta\b|\bsjå\b|\bnokon\b|\bkorleis\b|\bpåverka\b|\bmykje\b|\ballereie\b|\bfunnen\b|\bbrukar\b|\bbrukarar\b|\bbrukarane\b|ver vennleg' \
            app lib components hooks providers 2>/dev/null \
            | grep -v node_modules || true)
          if [ -n "$FOUND" ]; then
            echo "FAIL: Nynorsk words detected (use bokmal):"
            echo "$FOUND"
            exit 1
          fi
          echo "PASS: No nynorsk references found."

  # ─── CRON CONFIGURATION GUARD (STEG 1.4) ───
  cron-guard:
    name: Cron Configuration Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure vercel.json cron paths use header-based auth (no query-param secret)
        run: |
          echo "Checking vercel.json for query-param secrets..."
          if grep -q 'secret=' vercel.json; then
            echo "FAIL: vercel.json contains 'secret=' — must use header-based Authorization."
            grep -n 'secret=' vercel.json
            exit 1
          fi
          echo "PASS: No query-param secrets in vercel.json."

      - name: Ensure cron paths have corresponding route files
        run: |
          echo "Verifying cron paths map to existing route files..."
          FAIL=0
          while IFS= read -r path; do
            expected_file="app${path}/route.ts"
            if [ ! -f "$expected_file" ]; then
              echo "FAIL: Cron path '$path' has no corresponding file at $expected_file"
              FAIL=1
            else
              echo "OK: $path -> $expected_file exists"
            fi
          done < <(grep '"path"' vercel.json | sed 's/.*"path": *"\([^"]*\)".*/\1/')
          exit $FAIL

  # ─── CONCEPT GUARD (STEG B11 — B11) ───
  concept-guard:
    name: Konseptvakt — Koblingsmodellen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ingen samtykkeflyt
        run: |
          echo "Checking for re-introduction of acceptance flow..."
          if grep -rn "acceptedBy\|rejectedBy\|match/accept" \
               app/ lib/ components/ prisma/ --include=*.ts --include=*.tsx --include=*.prisma; then
            echo "::error::Samtykkeflyt gjeninnført. Se TOSOM-MASTERPLAN-v3.0 DEL 2."
            exit 1
          fi
          echo "PASS: No acceptance flow detected."

      - name: Kun én matchemotor
        run: |
          echo "Checking for multiple match engines..."
          if grep -rn "findBestMatchFor" app/ lib/ --include=*.ts; then
            echo "::error::Andre matchemotor gjeninnført."
            exit 1
          fi
          echo "PASS: Only one match engine found."

      - name: Ingen 05:00 i brukervendt tekst
        run: |
          echo "Checking for operational details leaked to user-facing text..."
          if grep -rn "05:00\|kl. 5" app/ components/ --include=*.tsx | grep -v admin; then
            echo "::error::Driftsdetalj lekket til brukervendt tekst."
            exit 1
          fi
          echo "PASS: No operational details in user-facing text."

  # ─── COMBINED STATUS ───
  status:
    name: CI Status
    needs: [lint, typecheck, build, test, e2e, prisma, prisma-singleton, ai-guard, lang-guard, cron-guard, concept-guard]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check if all jobs passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
              [ "${{ needs.typecheck.result }}" != "success" ] || \
              [ "${{ needs.build.result }}" != "success" ] || \
              [ "${{ needs.test.result }}" != "success" ] || \
              [ "${{ needs.e2e.result }}" != "success" ] || \
              [ "${{ needs.prisma.result }}" != "success" ] || \
              [ "${{ needs.prisma-singleton.result }}" != "success" ] || \
              [ "${{ needs.ai-guard.result }}" != "success" ] || \
              [ "${{ needs.lang-guard.result }}" != "success" ] || \
              [ "${{ needs.cron-guard.result }}" != "success" ] || \
              [ "${{ needs.concept-guard.result }}" != "success" ]; then
            echo "CI pipeline failed!"
            exit 1
          fi
          echo "CI pipeline passed!"
