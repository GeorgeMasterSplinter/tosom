# ToSom — CD Pipeline (produksjonsverifisering)
# Kjøres etter at «ToSom CI» er fullført med grønn status på main/master
#
# Arkitektur (oppdatert 10.11): Deploys til produksjonsdomenet utføres av
# Vercels GIT-INTEGRASJON (hver push til main → build + production deploy).
# GitHub Actions utfører IKKE en parallell deploy: det tidligere
# «Deploy to Vercel»-jobbet (vercel deploy --prebuilt --prod) var redundant —
# det feilet i CLI-steget etter at buildet var grønt, mens selve deployen
# allikevel gikk via git-integration. Resultatet var rødt CD uten at prod
# ble blokkert. Pipelineen gjør nå:
#   1. ci-gate        — kvalitetssjekk (kun ved manuell trigger)
#   2. db-migrate     — Prisma-migrasjoner mot prod-DB FØR ny kode skal gjelde
#   3. verify-deploy  — poller Vercel-API: den nyeste deploymenten må bli
#                       READY (target=production) innen 10 minutter
#   4. health-check   — curl health-endepunktet etter at deployen er ready
#
# A3 — Kvalitetsporten (systemaudit 03.09) er fortsatt gjeldende for CI:
# manuell trigger (workflow_dispatch) må kjøre de sentrale quality-checkene
# (lint + tsc + lang + jest) grønn i ci-gate før db-migrate/verify kjører.

name: ToSom CD

on:
  workflow_run:
    workflows: ["ToSom CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ─── PRE-DEPLOY CI GATE (funn 8, systemaudit 03.09) ───
  # Manuell trigger (workflow_dispatch) omgikk tidligere kvalitetsporten:
  # «if: workflow_dispatch || ci_green» short-circuiterer til true, så en
  # manuell deploy kunne kjøre selv med rød/ikke-kjørt CI. Nå må en MANUELL
  # trigger kjøre de sentrale quality-checkene (lint + tsc + lang + jest), og
  # de må gå grønn — db-migrate/verify-deploy er avhengige via «needs». For
  # automatisk trigger (workflow_run) er CI allerede grønn (conclusion-filtret),
  # så gate-jobben er en no-op (undgår dobbelt CI).
  ci-gate:
    name: Pre-Deploy CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Auto-trigger — CI kjørte allerede (deploy gates på conclusion)
        if: github.event_name == 'workflow_run'
        run: echo "Auto-trigger (workflow_run) — gate er gattet på CI-conclusion, ingen gjenkjøring."
      - name: Checkout (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      - name: Setup Node.js (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npm ci
      - name: Prisma generate (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx prisma generate
      - name: ESLint (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx next lint --max-warnings 0
      - name: Type check (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx tsc --noEmit
      - name: Language invariant (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify:lang
      - name: Unit tests (manuell trigger)
        if: github.event_name == 'workflow_dispatch'
        run: npx jest --ci --silent

  # ─── DB MIGRATIONS (prod) — sak 7, systemaudit 03.09 ───
  # Prisma-migrasjoner til prod-DB kjører FØR ny kode gjelde, slik at schemat
  # er klart. Idempotent — prisma migrate deploy legger kun på ventende
  # migrasjoner. Gated på samme måte som verify-deploy: automatisk
  # (workflow_run) kun ved grønn CI, manuell (workflow_dispatch) kun ved
  # grønn ci-gate. Krever secrets.DATABASE_URL (prod, lagt inn 03.09).
  db-migrate:
    name: Apply DB Migrations (prod)
    runs-on: ubuntu-latest
    needs: ci-gate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Apply pending migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ─── VERIFY PRODUCTION DEPLOYMENT ───
  # Vercels git-integration deployer hver push til main (build + prod). Dette
  # steget gjør deploy-statusen SYNLIG og reell i CD: det poller Vercel-API
  # for den nyeste deploymenten i prosjektet og krever at den når
  # READY med target=production innen 10 minutter.
  #   ERROR  → gate feiler (rød): bygget/deployen feilet — prod er ikke oppdatert.
  #   READY  → grønn: prod kjører den ferske deployen.
  #   timeout → rød: ingen READY-deploy innen tidsgrensen (f.eks. CI og
  #             git-integration kjører parallelt, og deployen tok for lenge).
  # Krever secrets.VERCEL_TOKEN + secrets.VERCEL_PROJECT_ID (prod, som den
  # tidligere deploy-jobben brukte).
  verify-deploy:
    name: Verify Production Deployment
    runs-on: ubuntu-latest
    needs: db-migrate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: production
      url: https://tosom.no
    steps:
      - name: Poll Vercel API for READY production-deployment
        timeout-minutes: 12
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Vent på at Vercel-git-integration deployen blir READY..."
          for i in $(seq 1 40); do
            RESP=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?project-id=$VERCEL_PROJECT_ID&limit=1" || echo '{}')
            DEPLOY_ID=$(printf '%s' "$RESP" | jq -r '.deployments[0].id // empty')
            STATE=$(printf '%s' "$RESP" | jq -r '.deployments[0].readyState // "UNKNOWN"')
            TARGET=$(printf '%s' "$RESP" | jq -r '.deployments[0].target // empty')
            REASON=$(printf '%s' "$RESP" | jq -r '.deployments[0].readyStateReason // empty')
            echo "Forsøk ${i}/40: deployment=${DEPLOY_ID:-?} state=${STATE} target=${TARGET} reason=${REASON}"
            if [ "$STATE" = "READY" ] && [ "$TARGET" = "production" ]; then
              echo "Production deployment er READY: ${DEPLOY_ID}"
              exit 0
            fi
            if [ "$STATE" = "ERROR" ]; then
              echo "::error::Den nyeste Vercel-deploymenten er i ERROR (${DEPLOY_ID}: ${REASON})."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Tidmanke: ingen READY production-deployment etter 10 minutter."
          exit 1

  # ─── POST-DEPLOY HEALTH CHECK ───
  health-check:
    name: Post-Deploy Health Check
    runs-on: ubuntu-latest
    needs: verify-deploy
    if: always()
    steps:
      - name: Health Check
        run: |
          echo "Waiting 60s for deployment to stabilize..."
          sleep 60
          echo "Checking health endpoint..."
          curl -f https://tosom.no/api/system/health || echo "Health check pending (may need stabilization time)"
